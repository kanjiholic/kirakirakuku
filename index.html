<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUKU BUSYO</title>
  
  <!-- ファビコンおよびiOSホーム画面アイコン -->
  <link rel="icon" href="image_1.png" type="image/png">
  <link rel="apple-touch-icon" href="image_1.png">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* キャラクター配置エリア（最背面） */
    #character-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* キャラクターサイズ（120px） */
    .spawned-char {
      position: absolute;
      width: 120px;
      height: auto;
      pointer-events: none;
      opacity: 0.85;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    /* タイトルロゴ画像スタイル */
    .title-logo {
      width: 100%;
      max-width: 280px;
      height: auto;
      margin: 0 auto 12px;
      display: block;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 22px;
      color: #333;
    }

    /* カウントダウン＆正誤判定オーバーレイ */
    .feedback-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 100px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 10;
      background: rgba(255, 255, 255, 0.6);
    }

    .feedback-overlay.show {
      opacity: 1;
    }

    .feedback-overlay.correct {
      color: rgba(46, 196, 182, 0.9);
      background: transparent;
    }

    .feedback-overlay.incorrect {
      color: rgba(230, 57, 70, 0.9);
      background: transparent;
    }

    .feedback-overlay.countdown {
      color: #457b9d;
      font-size: 120px;
    }

    /* プレイヤー選択エリア */
    .player-select-box {
      background: #eef2f7;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      width: 100%;
    }

    .player-select-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .player-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .player-btn {
      padding: 10px 6px;
      font-size: 14px;
      font-weight: bold;
      background: #ffffff;
      color: #2b2d42;
      border: 2px solid #d8e2dc;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-btn.active {
      background: #457b9d;
      color: white;
      border-color: #1d3557;
    }

    .player-name-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 110px;
    }

    .edit-name-btn {
      font-size: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
    }

    /* ゲーム中の上部コントロール */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .current-player-tag {
      font-size: 14px;
      font-weight: bold;
      color: #457b9d;
      background: #eef2f7;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .btn-back {
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
      background-color: #8d99ae;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-back:active {
      opacity: 0.8;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      padding: 12px;
      background: #eef2f7;
      border-radius: 12px;
    }

    .time { color: #e63946; }
    .score { color: #1d3557; }

    .card {
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .problem {
      font-size: 48px;
      font-weight: bold;
      color: #2b2d42;
      margin-bottom: 8px;
    }

    .answer-display {
      font-size: 36px;
      font-weight: bold;
      color: #457b9d;
      min-height: 44px;
      border-bottom: 3px solid #457b9d;
      width: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* テンキーグリッド */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .key-btn {
      padding: 18px 0;
      font-size: 26px;
      font-weight: bold;
      border: none;
      background-color: #edf2f4;
      color: #2b2d42;
      border-radius: 12px;
      box-shadow: 0 4px 0 #d8e2dc;
      cursor: pointer;
      touch-action: manipulation;
    }

    .key-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .key-zero {
      grid-column: 2;
    }

    .start-screen, .result-screen, .titles-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* 称号ボックス */
    .rank-box {
      background: #eef2f7;
      padding: 12px 20px;
      border-radius: 12px;
      margin: 4px 0;
      width: 100%;
    }

    .rank-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 4px;
    }

    .rank-name {
      font-size: 20px;
      font-weight: bold;
      color: #e63946;
    }

    /* 記録画面のスクロールコンテナ */
    .records-container {
      width: 100%;
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    /* 称号一覧リスト */
    .title-list {
      width: 100%;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .title-item {
      background: #f8f9fa;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #e9ecef;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-item.unlocked {
      background: #e8f5e9;
      border-color: #a5d6a7;
    }

    .title-item .name {
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }

    .title-item.unlocked .name {
      color: #2e7d32;
    }

    .title-item .condition {
      font-size: 12px;
      color: #888;
    }

    .title-item.unlocked .condition {
      color: #2e7d32;
      font-weight: bold;
    }

    /* 苦手問題セクション */
    .weak-box {
      background: #fff3f3;
      border: 1px solid #ffcdd2;
      border-radius: 12px;
      padding: 12px;
      text-align: left;
    }

    .weak-title {
      font-size: 14px;
      font-weight: bold;
      color: #c62828;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .weak-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 14px;
    }

    .weak-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed #ffebee;
      color: #333;
    }

    .weak-item:last-child {
      border-bottom: none;
    }

    .weak-count {
      font-weight: bold;
      color: #e63946;
    }

    .main-btn {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background-color: #457b9d;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 0 #1d3557;
      cursor: pointer;
      touch-action: manipulation;
    }

    .sub-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #2b2d42;
      background-color: #e0e1dd;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 0 #bdc3c7;
      cursor: pointer;
      touch-action: manipulation;
    }

    .main-btn:active, .sub-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- キャラクター配置エリア -->
  <div id="character-area"></div>

  <div class="container">
    <!-- カウントダウン＆正誤フィードバック表示用 -->
    <div id="feedback" class="feedback-overlay"></div>

    <!-- スタート画面 -->
    <div id="start-screen" class="start-screen">
      <!-- タイトルロゴ画像 -->
      <img src="logo.png" alt="KUKU BUSYO" class="title-logo">
      
      <p style="margin-top: 0;">30秒間に何問正解できるかな？<br><small style="color: #666;">（ミスは -1 点 &amp; 即打ち直し）</small></p>

      <!-- プレイヤー切替 -->
      <div class="player-select-box">
        <div class="player-select-label">🎮 プレイヤーをえらんでね</div>
        <div class="player-buttons">
          <div class="player-btn" id="pbtn-0" onclick="selectPlayer(0)">
            <span class="player-name-text" id="pname-0">プレイヤー1</span>
            <button class="edit-name-btn" onclick="renamePlayer(0, event)">✏️</button>
          </div>
          <div class="player-btn" id="pbtn-1" onclick="selectPlayer(1)">
            <span class="player-name-text" id="pname-1">プレイヤー2</span>
            <button class="edit-name-btn" onclick="renamePlayer(1, event)">✏️</button>
          </div>
          <div class="player-btn" id="pbtn-2" onclick="selectPlayer(2)">
            <span class="player-name-text" id="pname-2">プレイヤー3</span>
            <button class="edit-name-btn" onclick="renamePlayer(2, event)">✏️</button>
          </div>
          <div class="player-btn" id="pbtn-3" onclick="selectPlayer(3)">
            <span class="player-name-text" id="pname-3">プレイヤー4</span>
            <button class="edit-name-btn" onclick="renamePlayer(3, event)">✏️</button>
          </div>
        </div>
      </div>

      <div style="font-size: 16px; font-weight: bold; color: #1d3557; margin: 2px 0;">
        最高スコア: <span id="top-highscore">0</span> 点
      </div>

      <button class="main-btn" onclick="startCountdown()">スタート</button>
      <button class="sub-btn" onclick="showTitlesScreen()">称号一覧・きろく</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-screen" class="hidden">
      <div class="game-header">
        <button class="btn-back" onclick="backToTitle()">タイトルへ戻る</button>
        <span class="current-player-tag" id="game-player-name">プレイヤー1</span>
      </div>

      <div class="status-bar">
        <div>残り時間: <span id="time-display" class="time">30</span>s</div>
        <div>スコア: <span id="score-display" class="score">0</span></div>
      </div>

      <div class="card">
        <div id="problem-display" class="problem">? × ?</div>
        <div id="answer-display" class="answer-display"></div>
      </div>

      <div class="keypad">
        <button class="key-btn" onclick="appendNum(7)">7</button>
        <button class="key-btn" onclick="appendNum(8)">8</button>
        <button class="key-btn" onclick="appendNum(9)">9</button>
        <button class="key-btn" onclick="appendNum(4)">4</button>
        <button class="key-btn" onclick="appendNum(5)">5</button>
        <button class="key-btn" onclick="appendNum(6)">6</button>
        <button class="key-btn" onclick="appendNum(1)">1</button>
        <button class="key-btn" onclick="appendNum(2)">2</button>
        <button class="key-btn" onclick="appendNum(3)">3</button>
        <button class="key-btn key-zero" onclick="appendNum(0)">0</button>
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="result-screen hidden">
      <h1>タイムアップ！</h1>
      <div style="font-size: 14px; color: #666;" id="result-player-name">プレイヤー1</div>
      <p style="font-size: 22px; margin: 4px 0;">スコア: <strong id="final-score" style="color: #1d3557;">0</strong> 点</p>

      <div class="rank-box">
        <div class="rank-title">獲得した称号</div>
        <div id="rank-display" class="rank-name">-</div>
      </div>

      <button class="main-btn" onclick="startCountdown()">もう一度遊ぶ</button>
      <button class="btn-back" onclick="backToTitle()" style="width: 100%; padding: 12px; margin-top: 4px;">タイトルに戻る</button>
    </div>

    <!-- 称号一覧・きろく画面 -->
    <div id="titles-screen" class="titles-screen hidden">
      <h1>称号一覧・きろく</h1>
      <div style="font-size: 14px; color: #666;" id="titles-player-name">プレイヤー1</div>
      <div style="font-size: 16px; font-weight: bold; color: #1d3557; margin-bottom: 4px;">
        最高スコア: <span id="titles-highscore">0</span> 点
      </div>

      <div class="records-container">
        <!-- 苦手問題枠 -->
        <div class="weak-box">
          <div class="weak-title">⚠️ にがてなもんだい ワースト5</div>
          <ul id="weak-list" class="weak-list">
            <!-- JSで動的生成 -->
          </ul>
        </div>

        <!-- 称号リスト -->
        <div id="title-list" class="title-list">
          <!-- JSで動的生成 -->
        </div>
      </div>

      <button class="btn-back" onclick="backToTitle()" style="width: 100%; padding: 12px; margin-top: 4px;">タイトルに戻る</button>
    </div>
  </div>

  <script>
    let timer = null;
    let countdownTimer = null;
    let timeLeft = 30;
    let score = 0;
    let currentProblemStr = "";
    let currentAns = 0;
    let inputAnswer = "";
    let feedbackTimer = null;
    let isPlaying = false;

    // 画像ファイル名
    const characterImages = ['image_0.png', 'image_1.png', 'image_2.png'];

    // 称号マスターデータ
    const titleMaster = [
      { minScore: 30, name: "みんなのあこがれ九九はかせ！" },
      { minScore: 25, name: "かんぺき九九たつじん" },
      { minScore: 20, name: "そこそこすごい九九めいじん" },
      { minScore: 15, name: "ちょっとすごい九九せんせい" },
      { minScore: 10, name: "ふつうの九九小学生" },
      { minScore: 5,  name: "ちゃっぽけ九九みならい" },
      { minScore: 0,  name: "がんばり賞" }
    ];

    let currentPlayerIndex = 0;
    let players = [
      { name: "プレイヤー1", highScore: 0, mistakes: {} },
      { name: "プレイヤー2", highScore: 0, mistakes: {} },
      { name: "プレイヤー3", highScore: 0, mistakes: {} },
      { name: "プレイヤー4", highScore: 0, mistakes: {} }
    ];

    // Web Audio APIによる効果音
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    window.addEventListener('DOMContentLoaded', () => {
      loadPlayerData();
      renderPlayerButtons();
      updatePlayerUI();
    });

    function loadPlayerData() {
      const saved = localStorage.getItem('kuku_players_data');
      if (saved) {
        try {
          const loaded = JSON.parse(saved);
          players = loaded.map(p => ({
            name: p.name || "プレイヤー",
            highScore: p.highScore || 0,
            mistakes: p.mistakes || {}
          }));
        } catch(e) {}
      }
      const savedIndex = localStorage.getItem('kuku_current_player');
      if (savedIndex !== null) {
        currentPlayerIndex = parseInt(savedIndex, 10);
      }
    }

    function savePlayerData() {
      localStorage.setItem('kuku_players_data', JSON.stringify(players));
      localStorage.setItem('kuku_current_player', currentPlayerIndex);
    }

    function selectPlayer(index) {
      currentPlayerIndex = index;
      savePlayerData();
      renderPlayerButtons();
      updatePlayerUI();
    }

    function renamePlayer(index, event) {
      event.stopPropagation();
      const currentName = players[index].name;
      const newName = prompt("なまえを入力してね（最大8文字）", currentName);
      if (newName && newName.trim() !== "") {
        players[index].name = newName.trim().slice(0, 8);
        savePlayerData();
        renderPlayerButtons();
        updatePlayerUI();
      }
    }

    function renderPlayerButtons() {
      for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`pbtn-${i}`);
        const nameEl = document.getElementById(`pname-${i}`);
        nameEl.textContent = players[i].name;
        if (i === currentPlayerIndex) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    }

    function updatePlayerUI() {
      const p = players[currentPlayerIndex];
      document.getElementById('top-highscore').textContent = p.highScore;
      document.getElementById('titles-highscore').textContent = p.highScore;
      document.getElementById('game-player-name').textContent = p.name;
      document.getElementById('result-player-name').textContent = p.name;
      document.getElementById('titles-player-name').textContent = p.name;
    }

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'incorrect') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'beep') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'start') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function showFeedback(type) {
      const el = document.getElementById('feedback');
      clearTimeout(feedbackTimer);
      
      el.className = 'feedback-overlay show ' + (type === 'correct' ? 'correct' : 'incorrect');
      el.textContent = type === 'correct' ? '〇' : '✖';

      feedbackTimer = setTimeout(() => {
        el.className = 'feedback-overlay';
      }, 300);
    }

    function spawnCharacter() {
      const area = document.getElementById('character-area');
      const imgIndex = Math.floor(Math.random() * characterImages.length);
      const img = document.createElement('img');
      img.src = characterImages[imgIndex];
      img.classList.add('spawned-char');

      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      const charSize = 120;
      const maxX = Math.max(0, viewportWidth - charSize);
      const maxY = Math.max(0, viewportHeight - charSize);

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      img.style.left = randomX + 'px';
      img.style.top = randomY + 'px';

      area.appendChild(img);
    }

    function removeCharacter() {
      const area = document.getElementById('character-area');
      if (area.lastElementChild) {
        area.removeChild(area.lastElementChild);
      }
    }

    function recordMistake(problemStr) {
      const p = players[currentPlayerIndex];
      if (!p.mistakes) p.mistakes = {};
      p.mistakes[problemStr] = (p.mistakes[problemStr] || 0) + 1;
      savePlayerData();
    }

    function startCountdown() {
      isPlaying = false;
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('titles-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      document.getElementById('character-area').innerHTML = '';

      score = 0;
      timeLeft = 30;
      inputAnswer = "";
      document.getElementById('score-display').textContent = score;
      document.getElementById('time-display').textContent = timeLeft;

      nextProblem();

      const el = document.getElementById('feedback');
      let count = 3;

      el.className = 'feedback-overlay show countdown';
      el.textContent = count;
      playSound('beep');

      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          el.textContent = count;
          playSound('beep');
        } else if (count === 0) {
          el.textContent = 'GO!';
          playSound('start');
        } else {
          clearInterval(countdownTimer);
          el.className = 'feedback-overlay';
          startGameTimer();
        }
      }, 800);
    }

    function startGameTimer() {
      isPlaying = true;
      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-display').textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function generateProblem() {
      const num1 = Math.floor(Math.random() * 9) + 1;
      const num2 = Math.floor(Math.random() * 9) + 1;
      return { num1, num2, ans: num1 * num2 };
    }

    function nextProblem() {
      const { num1, num2, ans } = generateProblem();
      currentAns = ans;
      currentProblemStr = `${num1} × ${num2}`;
      document.getElementById('problem-display').textContent = currentProblemStr;
      inputAnswer = "";
      updateAnswerDisplay();
    }

    function appendNum(num) {
      if (!isPlaying) return;

      const strAns = currentAns.toString();
      const nextInput = inputAnswer + num;
      const index = nextInput.length - 1;
      
      if (strAns[index] !== num.toString()) {
        playSound('incorrect');
        showFeedback('incorrect');
        score--;
        document.getElementById('score-display').textContent = score;
        
        recordMistake(currentProblemStr);
        removeCharacter();

        inputAnswer = "";
        updateAnswerDisplay();
        return;
      }

      inputAnswer = nextInput;
      updateAnswerDisplay();

      if (inputAnswer === strAns) {
        playSound('correct');
        showFeedback('correct');
        score++;
        document.getElementById('score-display').textContent = score;
        
        spawnCharacter();
        nextProblem();
      }
    }

    function updateAnswerDisplay() {
      document.getElementById('answer-display').textContent = inputAnswer;
    }

    function getRankTitle(score) {
      for (let t of titleMaster) {
        if (score >= t.minScore) return t.name;
      }
      return "がんばり賞";
    }

    function showTitlesScreen() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('titles-screen').classList.remove('hidden');

      const p = players[currentPlayerIndex];

      // 苦手問題トップ5の生成
      const weakListEl = document.getElementById('weak-list');
      weakListEl.innerHTML = '';
      
      const mistakesObj = p.mistakes || {};
      const sortedMistakes = Object.keys(mistakesObj)
        .map(key => ({ problem: key, count: mistakesObj[key] }))
        .sort((a, b) => b.count - a.count)
        .slice(0, 5);

      if (sortedMistakes.length === 0) {
        weakListEl.innerHTML = '<li style="color: #888; font-size: 13px;">まだミスしたもんだいはありません！</li>';
      } else {
        sortedMistakes.forEach((item, idx) => {
          const li = document.createElement('li');
          li.className = 'weak-item';
          li.innerHTML = `
            <span>${idx + 1}位: <strong>${item.problem}</strong></span>
            <span class="weak-count">${item.count}回ミス</span>
          `;
          weakListEl.appendChild(li);
        });
      }

      // 称号リストの生成
      const listEl = document.getElementById('title-list');
      listEl.innerHTML = '';

      titleMaster.forEach(t => {
        const isUnlocked = p.highScore >= t.minScore;
        const item = document.createElement('div');
        item.className = 'title-item ' + (isUnlocked ? 'unlocked' : '');
        
        const condText = t.minScore === 0 ? "初期" : `${t.minScore}点以上`;
        const statusText = isUnlocked ? "★ 獲得済み" : `${condText}`;

        item.innerHTML = `
          <div class="name">${t.name}</div>
          <div class="condition">${statusText}</div>
        `;
        listEl.appendChild(item);
      });
    }

    function backToTitle() {
      isPlaying = false;
      clearInterval(timer);
      clearInterval(countdownTimer);
      document.getElementById('feedback').className = 'feedback-overlay';
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('titles-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
      
      document.getElementById('character-area').innerHTML = '';
      updatePlayerUI();
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timer);
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      
      document.getElementById('final-score').textContent = score;
      document.getElementById('rank-display').textContent = getRankTitle(score);

      if (score > players[currentPlayerIndex].highScore) {
        players[currentPlayerIndex].highScore = score;
        savePlayerData();
      }
      updatePlayerUI();
    }
  </script>
</body>
</html>
